name: Optimize Images (create PR)

on:
  push:
    paths:
      - 'Finished Drawings/**'
      - 'Ceremony/**'
  workflow_dispatch: {}
  
permissions:
  contents: write

jobs:
  optimize:
    name: Optimize images and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install ImageMagick and ensure magick is available
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          # If magick isn't available but convert is, create a small shim so scripts using "magick" still work
          if ! command -v magick >/dev/null 2>&1 ; then
            if command -v convert >/dev/null 2>&1 ; then
              echo "magick not found — creating shim to call convert"
              sudo bash -c 'cat > /usr/local/bin/magick <<'"'"'SH'"'"'
#!/bin/sh
exec convert "$@"
SH
'
              sudo chmod +x /usr/local/bin/magick
            else
              echo "ERROR: neither magick nor convert found after installing imagemagick"
              exit 1
            fi
          else
            echo "magick found at: $(command -v magick)"
          fi

      - name: Diagnostic: report ImageMagick binaries
        run: |
          echo "which magick: $(command -v magick || true)"
          echo "which convert: $(command -v convert || true)"
          magick -version || convert -version || true

      - name: Ensure script is executable
        run: chmod +x .github/scripts/convert-images.sh || true

      - name: Run conversion script
        run: ./.github/scripts/convert-images.sh

      - name: List created optimized files
        run: ls -R optimized-images || true

      - name: Create pull request with optimized images
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add optimized images (webp) [ci skip]"
          branch: optimized-images-${{ github.run_id }}
          title: "Add optimized images (auto)"
          body: |
            This PR adds optimized and watermarked WebP copies generated automatically.
          base: main
          labels: auto-generated, optimize-images
          path: optimized-images
